name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Check and package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check package versions
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          python = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if cargo != python:
              raise SystemExit(f'Cargo version {cargo} does not match Python version {python}')
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              tag = os.environ['GITHUB_REF_NAME']
              if tag != f'v{cargo}':
                  raise SystemExit(f'Release tag {tag} does not match package version {cargo}')
          PY
      - name: Install Rust tools
        run: |
          rustup update stable --no-self-update
          rustup override set stable
          rustup component add clippy rustfmt
      - name: Install shells on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fish zsh
      - name: Install fish on macOS
        if: runner.os == 'macOS'
        run: brew install fish
      - name: Check formatting and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Build release wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          args: --release --locked --out dist
      - name: Smoke-test installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/mate-venv"
          bin="$RUNNER_TEMP/mate-venv/bin"
          "$bin/python" -m pip install --no-index dist/*.whl
          version=$("$bin/python" -c 'from importlib.metadata import version; print(version("make-mate"))')
          test "$("$bin/mate" --version)" = "mate $version"
          cd tests/fixtures/basic
          "$bin/mate" --list | grep -F 'release <version> [target=all]'
          test "$("$bin/mate" release 1.2.3)" = 'VERSION=1.2.3 TARGET=all'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish wheels to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/make-mate/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publish release with wheels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag dist/*.whl
